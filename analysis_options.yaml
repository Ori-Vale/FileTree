# 此文件用于配置分析器（analyzer），该工具会对 Dart 代码进行静态分析，
# 以检查其中的错误、警告及代码规范问题（lints）。
#
# 分析器识别出的问题会显示在支持 Dart 的 IDE（集成开发环境）界面中
# (https://dart.dev/tools#ides-and-editors)。此外，您也可以通过在命令行中运行
# `flutter analyze` 来调用该分析器。

# ---------------------------------------------------------------------------
# 引入推荐的代码规范规则集
# ---------------------------------------------------------------------------

# 下方一行代码启用了针对 Flutter 应用、软件包（packages）及插件的一组推荐规范规则，
# 旨在鼓励开发者遵循良好的编码实践
analyzer:
  exclude:
    - build/**
    - windows/**
    - macos/**
include: package:flutter_lints/flutter.yaml

# ---------------------------------------------------------------------------
# 代码规范（Lint）规则配置
# ---------------------------------------------------------------------------

linter:
  # 您可以在下方部分自定义应用于此项目的规范规则。
  # 通过此设置，您可以禁用上方 `include` 引入的
  # `package:flutter_lints/flutter.yaml` 文件中的规则，
  # 也可以启用额外的规则。
  # 所有可用的规范规则及其详细文档均发布于：
  # https://dart.dev/lints
  #
  # 除了在下方部分针对整个项目禁用某条规范规则外，
  # 您也可以针对单行代码或特定的 Dart 文件单独屏蔽某条规则。
  # 具体做法是：在触发该规范问题的代码行或文件顶部，
  # 使用 `// ignore: name_of_lint` 或 `// ignore_for_file: name_of_lint`
  # 这样的语法进行标记
  rules:
    # avoid_print: false              # 取消注释以禁用 `avoid_print` 规则
                                      # (该规则建议避免使用 print() 输出)
    # prefer_single_quotes: true      # 取消注释以启用 `prefer_single_quotes` 规则
                                      # (该规则建议使用单引号而非双引号)

# ---------------------------------------------------------------------------
# 参考信息
# ---------------------------------------------------------------------------

# 关于此文件的更多详细信息，请参阅：
# https://dart.dev/guides/language/analysis-options
